<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAce AI - Trợ lý học tập thông minh</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="shortcut icon" href="./icons/icon.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Đảm bảo code block trong chat (markdown ```) luôn scroll ngang thay vì tràn/cắt khung.
         Fallback bằng CSS thuần — chạy kể cả khi typography plugin không load kịp. */
      .prose pre,
      .markdown-body pre {
        overflow-x: auto;
        max-width: 100%;
        white-space: pre;
        /* ~14px theo chuẩn readability cho code (>=12px), rem để scale theo zoom user */
        font-size: 0.875rem;
        line-height: 1.55;
      }
      .prose code {
        overflow-wrap: anywhere;
        word-break: break-word;
        font-size: 0.875rem;
      }
      .prose pre code {
        overflow-wrap: normal;
        word-break: normal;
        white-space: pre;
        font-size: inherit;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar:horizontal {
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "recharts": "https://esm.sh/recharts@^3.7.0",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react-hot-toast": "https://esm.sh/react-hot-toast@^2.6.0",
          "axios": "https://esm.sh/axios@^1.13.4"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
